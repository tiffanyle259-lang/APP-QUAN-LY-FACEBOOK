# Cấu hình Giai đoạn 1 – Tự động nội dung fanpage Golden Lion.
# Thông tin bí mật (token, khóa API) KHÔNG ghi ở đây, mà đặt trong GitHub Secrets.

file_du_lieu: data/DuLieuNen_Marketing_HoanBao.xlsx
mui_gio: Asia/Ho_Chi_Minh

# Mặc định khi Google Sheet chưa có tab "Cài đặt". Chỉnh nhanh trong Sheet, không cần sửa ở đây.
che_do_duyet: true

# Các cột trong file Excel KHÔNG đưa cho AI (giá trên web chưa xác nhận lại).
cot_bo_qua:
  - Giá tham khảo trên web (VNĐ)

# Thư mục con trong "Kho-Marketing" cho những ô không ghi tên thư mục cụ thể.
thu_muc:
  anh_chung: anh-minh-hoa-chung
  theo_nganh:
    "Xưởng giày dép, túi da": nganh-giay-dep
    "Xưởng sofa, nệm, nội thất bọc": nganh-sofa-nem
    "Xưởng đồ gỗ, tủ bếp, laminate": nganh-do-go
    "Nội thất ô tô": nganh-o-to
    "Đại lý, cửa hàng vật tư": nganh-dai-ly

# Thư mục Drive ngoài Kho-Marketing mà app tự lấy ảnh/video mới về xếp vào kho (ghi ID thư mục).
# Phải chia sẻ thư mục đó cho tài khoản dịch vụ với quyền Biên tập. File được CHUYỂN vào kho, không sao chép.
nguon_anh_them: []

# Thư mục Drive dùng chung của công ty (chỉ ĐỌC, app không di chuyển hay xóa gì). Thư mục loại trừ bên dưới không dùng;
# VIDEO chỉ lấy trong thư mục có tên chứa một trong các cụm ở nguon_chung_video_tu (video sạch AI, reel).
nguon_chung:
  - 1FCeoSgiWdNWMQm7BhGGj8ZqmR6Z93gFL   # TÀI NGUYÊN CHUNG (công ty Hoàn Bảo)
nguon_chung_loai_tru: ["seo", "vat lieu ghep video", "banner display", "video clip that"]
nguon_chung_video_tu: ["video sach ai", "video dang reel"]
# ẢNH chỉ lấy trong thư mục có tên chứa một trong các cụm này (ảnh sạch AI); ảnh ở chỗ khác không dùng.
nguon_chung_anh_tu: ["anh sach ai"]
# Tên gọi khác của sản phẩm trên file ảnh/video (mã trong Excel -> cách gọi trên tên file).
ma_phu:
  SUPERPRO: [SPRO, S-PRO]
# true: chỉ dùng thư mục nguồn chung, không lấy ảnh/video trong Kho-Marketing nữa (sếp sắp xóa kho này).
chi_dung_nguon_chung: true

# Không dùng lại cùng một ảnh/video trong số ngày này (nếu kho còn file khác).
khong_lap_lai_trong_ngay: 28

# Lịch đăng cho Fanpage chính (Golden Lion). Ngoài lịch gốc trong file Excel (1 bài/ngày), mỗi ngày Thứ 2 đến Thứ 7 thêm các khung dưới đây
# (tổng 6 bài/ngày); Chủ nhật có 6 bài riêng (khung_chu_nhat). Loại bài xoay vòng theo thứ trong tuần. Muốn ít bài hơn thì xóa bớt khung.
khung_them:
  - gio: "10:00"
    loai_bai: [Mẹo dùng keo, Giới thiệu sản phẩm, Theo ngành, Mẹo dùng keo, Giới thiệu sản phẩm, Theo ngành]
    goi_y: "Bài giữa buổi sáng: 1 mẹo thi công hoặc 1 câu hỏi xưởng hay gặp, 4-6 dòng, khác ý bài đầu ngày."
  - gio: "12:00"
    loai_bai: [Giới thiệu sản phẩm, Mẹo dùng keo, Giới thiệu sản phẩm, Mẹo dùng keo, Giới thiệu sản phẩm, Mẹo dùng keo]
    goi_y: "Góc nhìn khác với bài chính trong ngày: nêu 1 lợi ích cụ thể hoặc 1 tình huống xưởng hay gặp, ngắn gọn 4-6 dòng, đừng lặp ý bài sáng."
  - gio: "15:30"
    loai_bai: [Video demo thật, Theo ngành, Giới thiệu sản phẩm, Video demo thật, Mẹo dùng keo, Theo ngành]
    goi_y: "Bài buổi chiều, ngắn gọn dễ đọc: nếu có video thì dẫn người xem 'xem video để thấy tận mắt'; nếu không thì nêu 1 điểm khác biệt của sản phẩm."
  - gio: "17:30"
    loai_bai: [Giới thiệu sản phẩm, Theo ngành, Mẹo dùng keo, Giới thiệu sản phẩm, Theo ngành, Mẹo dùng keo]
    goi_y: "Bài cuối giờ làm việc: nhắc 1 vấn đề xưởng hay gặp lúc sắp tan ca và cách keo giải quyết, kết bằng lời mời nhắn Fanpage."
  - gio: "20:30"
    loai_bai: [Theo ngành, Giới thiệu sản phẩm, Theo ngành, Giới thiệu sản phẩm, Theo ngành, Giới thiệu sản phẩm]
    goi_y: "Bài buổi tối, giọng gần gũi: câu hỏi khách hay hỏi hoặc so sánh cách làm cũ với dùng keo phun, kết bằng lời mời inbox để được tư vấn."

khung_chu_nhat:
  - {gio: "08:00", loai_bai: Giới thiệu sản phẩm, goi_y: "Chào Chủ nhật, giới thiệu 1 sản phẩm chủ lực ngắn gọn, thân thiện, mời nhắn Fanpage."}
  - {gio: "10:00", loai_bai: Mẹo dùng keo, goi_y: "Mẹo thi công cho xưởng làm cuối tuần, 4-6 dòng."}
  - {gio: "12:00", loai_bai: Video demo thật, goi_y: "Giới thiệu video, mời xem để thấy tận mắt hiệu quả keo."}
  - {gio: "15:30", loai_bai: Theo ngành, goi_y: "Một ngành sản xuất và vấn đề keo hay gặp, cách xử lý."}
  - {gio: "17:30", loai_bai: Giới thiệu sản phẩm, goi_y: "Một ứng dụng cụ thể của sản phẩm, kết bằng lời mời tư vấn."}
  - {gio: "20:30", loai_bai: Mẹo dùng keo, goi_y: "Mẹo nhỏ cuối tuần, chuẩn bị cho tuần làm việc mới, mời inbox hỏi thêm."}

ai:
  model: claude-sonnet-5-5
  effort: medium

facebook:
  graph_version: v24.0
  app_id: "1570474760979317"

# Giai đoạn 2: chatbot Messenger và bình luận (chạy trên máy chủ riêng, xem render.yaml).
bot:
  model: claude-sonnet-5-5
  effort: low
