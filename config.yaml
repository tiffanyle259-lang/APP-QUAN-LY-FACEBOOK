    "Nội thất ô tô": nganh-o-to
    "Đại lý, cửa hàng vật tư": nganh-dai-ly

# Thư mục Drive ngoài Kho-Marketing mà app tự lấy ảnh/video mới về xếp vào kho (ghi ID thư mục).
