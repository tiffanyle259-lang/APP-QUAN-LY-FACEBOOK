name: Xếp ảnh vào kho

on:
  # Chạy tay sau khi thả ảnh/video vào thư mục Kho-Marketing/_chua-phan-loai.
  workflow_dispatch:

concurrency:
  group: kho-anh
  cancel-in-progress: false

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_KHO_ID: ${{ secrets.DRIVE_KHO_ID }}
      DATA_DRIVE_FILE_ID: ${{ secrets.DATA_DRIVE_FILE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hoanbao_mkt phan-loai
