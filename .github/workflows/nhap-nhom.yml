name: Nhập danh sách nhóm Facebook

on:
  # Chạy tay: đọc data/nhom_nhap.txt (mỗi dòng: Tên | link | ngành | luật) và thêm vào tab "Nhóm" trong Google Sheet.
  # Nhóm đã có (cùng link) được bỏ qua nên chạy lại an toàn.
  workflow_dispatch:

concurrency:
  group: nhap-nhom
  cancel-in-progress: false

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_DUYET_ID: ${{ secrets.SHEET_DUYET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hoanbao_mkt nhap-nhom --file data/nhom_nhap.txt
