name: Gán ảnh cho bài viết

on:
  # Chạy tay: điền ảnh/video từ kho vào các bài còn trống cột Ảnh/Video trong Sheet duyệt.
  workflow_dispatch:

concurrency:
  group: fanpage
  cancel-in-progress: false

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_KHO_ID: ${{ secrets.DRIVE_KHO_ID }}
      SHEET_DUYET_ID: ${{ secrets.SHEET_DUYET_ID }}
      DATA_DRIVE_FILE_ID: ${{ secrets.DATA_DRIVE_FILE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hoanbao_mkt gan-anh
