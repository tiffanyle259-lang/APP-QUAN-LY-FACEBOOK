name: Đặt chế độ duyệt bài

on:
  # Chạy tay: BAT = bài mới "Chờ duyệt" (duyệt tay), TAT = bài sạch tự lên lịch. Cũng đặt được trực tiếp ở ô B1 tab "Cài đặt" của Google Sheet.
  workflow_dispatch:
    inputs:
      che_do:
        description: "BAT (duyệt tay) hoặc TAT (tự duyệt)"
        required: true
        default: "TAT"
        type: choice
        options: ["TAT", "BAT"]

concurrency:
  group: che-do-duyet
  cancel-in-progress: false

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_DUYET_ID: ${{ secrets.SHEET_DUYET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hoanbao_mkt che-do-duyet --dat "${{ inputs.che_do }}"
