name: Nhập khách từ quảng cáo

on:
  # Chạy tay: đọc data/khach_quang_cao.csv (file "Biểu mẫu" tải từ Meta) và thêm vào tab "Khách hàng" trong Google Sheet.
  # Khách đã có (cùng mã hoặc cùng số điện thoại) được bỏ qua nên chạy lại an toàn. Không gửi email.
  workflow_dispatch:

concurrency:
  group: nhap-khach
  cancel-in-progress: false

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_DUYET_ID: ${{ secrets.SHEET_DUYET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hoanbao_mkt nhap-khach --file data/khach_quang_cao.csv
