name: Tạo bài cả tuần

on:
  # Thứ 6, 09:07 giờ VN (02:07 UTC): AI viết bài cho tuần sau.
  schedule:
    - cron: "7 2 * * 5"
  workflow_dispatch:
    inputs:
      tuan:
        description: "Ngày Thứ 2 của tuần cần tạo (vd 2026-10-12). Để trống = tuần sau"
        required: false

# Không cho hai lần chạy cùng lúc, tránh đăng trùng bài.
concurrency:
  group: fanpage
  cancel-in-progress: false

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_KHO_ID: ${{ secrets.DRIVE_KHO_ID }}
      SHEET_DUYET_ID: ${{ secrets.SHEET_DUYET_ID }}
      DATA_DRIVE_FILE_ID: ${{ secrets.DATA_DRIVE_FILE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hoanbao_mkt tao-tuan ${TUAN:+--tuan "$TUAN"}
        env:
          TUAN: ${{ inputs.tuan }}
