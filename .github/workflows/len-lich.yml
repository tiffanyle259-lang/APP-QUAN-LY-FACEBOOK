name: Lên lịch bài đã duyệt

on:
  # Mỗi giờ từ 6h23 đến 22h23 giờ VN (17 lần/ngày, tiết kiệm phút Actions):
  # bài nào trong Sheet chuyển sang "Duyệt" sẽ được hẹn giờ đăng trên Fanpage.
  schedule:
    - cron: "23 23,0-15 * * *"
  workflow_dispatch:

# Không cho hai lần chạy cùng lúc, tránh đăng trùng bài.
concurrency:
  group: fanpage
  cancel-in-progress: false

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_KHO_ID: ${{ secrets.DRIVE_KHO_ID }}
      SHEET_DUYET_ID: ${{ secrets.SHEET_DUYET_ID }}
      DATA_DRIVE_FILE_ID: ${{ secrets.DATA_DRIVE_FILE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hoanbao_mkt len-lich
