name: Báo cáo tuần

on:
  # Thứ 2, 08:07 giờ VN (01:07 UTC): lấy số liệu tương tác 7 ngày qua, lưu vào tab "Báo cáo tuần" của Google Sheet.
  # Nếu đã thêm EMAIL_WEBHOOK_URL và EMAIL_WEBHOOK_SECRET vào GitHub Secrets thì gửi cả email.
  schedule:
    - cron: "7 1 * * 1"
  workflow_dispatch:

concurrency:
  group: bao-cao-tuan
  cancel-in-progress: false

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_DUYET_ID: ${{ secrets.SHEET_DUYET_ID }}
      EMAIL_WEBHOOK_URL: ${{ secrets.EMAIL_WEBHOOK_URL }}
      EMAIL_WEBHOOK_SECRET: ${{ secrets.EMAIL_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hoanbao_mkt bao-cao-tuan
