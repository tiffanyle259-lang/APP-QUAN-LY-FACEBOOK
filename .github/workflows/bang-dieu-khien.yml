name: Bảng điều khiển

on:
  # Mỗi tối 21h (giờ VN) tự cập nhật; bấm tay bất cứ lúc nào để xem ngay.
  schedule:
    - cron: "11 14 * * *"
  workflow_dispatch:

concurrency:
  group: bang-dieu-khien
  cancel-in-progress: true

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_KHO_ID: ${{ secrets.DRIVE_KHO_ID }}
      SHEET_DUYET_ID: ${{ secrets.SHEET_DUYET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hoanbao_mkt bang-dieu-khien
      - uses: actions/upload-artifact@v4
        with:
          name: bang-dieu-khien
          path: bang-dieu-khien.html
          retention-days: 7
